name: Secret Scan

# 個人情報・秘匿情報が public リポジトリに入るのを防ぐ機械ゲート。
#   検知パターン: .github/secret-scan-patterns.txt
#   除外リスト  : .github/secret-scan-allowlist.txt
#
# 【重要】これは「push したあとに気づく」ための最後の砦であって、
# 一度 push すると履歴に残る。履歴から消すには全員の作業をやり直させる操作が要る。
# 本当の対策は「入れない」こと。docs/before_coding.md の線引き表を読む。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan tracked files
        shell: bash
        run: bash .github/scripts/secret_scan.sh
