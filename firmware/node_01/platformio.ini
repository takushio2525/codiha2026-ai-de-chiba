; PlatformIO プロジェクト設定ファイル
;
; ボード型番は暫定で Arduino Uno R4 WiFi を指定しています。
; 別のボードを使う場合は [env:xxx] の中身を差し替えてください。
; 例: Nano / ESP32 / ESP32-S3 など
;
; 参考: https://docs.platformio.org/en/latest/projectconf/index.html

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino

; ===== EMA を使うために必要な 2 行 =====
; 他のノードにも EMA を展開するときは、この 2 行も一緒にコピーする。

; 全ノード共通のライブラリ（firmware/common/lib/）を読み込む
lib_extra_dirs = ../common/lib

; include/ を各モジュールからも見えるようにする。
; PlatformIO は include/ を src/ にしか通さないため、この 1 行が無いと
; common/lib/ や lib/ の中の .cpp から SystemData.h が見つからない。
build_flags = -I include
