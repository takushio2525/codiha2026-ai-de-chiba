<!-- CHIZUBA のロゴ。頭文字 C を開いた弧で描き、開いた先に地点の点を置く。
     弧が地図（等高線・海岸線）、点が「いまの場所」を表す。
     要素が「弧」と「点」の 2 つだけなので、16px のタブアイコンでも潰れない。
     色は globals.css と同じ Okabe-Ito 系（地が color-ink、点が color-layer-evacuation）。
     注意: XML のコメントに二重ハイフンは書けないので、CSS 変数名は接頭辞なしで書いている。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CHIZUBA">
  <rect width="32" height="32" rx="8" fill="#16181d"/>
  <path
    d="M19.9 21.3A7.5 7.5 0 1 1 19.9 10.7"
    fill="none"
    stroke="#ffffff"
    stroke-width="4.6"
    stroke-linecap="round"
  />
  <circle cx="24.1" cy="16" r="3.1" fill="#0072b2"/>
</svg>
