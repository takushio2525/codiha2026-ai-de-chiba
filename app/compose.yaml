# 審査員はこのファイルだけで起動できる。
#
#   docker compose up
#   → http://localhost:3000
#
# 3000 が塞がっているときだけ `CHIZUBA_PORT=3100 docker compose up`。
#
# コンテナは 2 つ。
#
#   web … サービス本体（Next.js。node:22-slim の multi-stage ビルド）
#   db  … PostgreSQL 17。住民と行政の投稿・ユーザーを保存する
#
# 地図に載せるオープンデータ（避難場所・AED・子育て施設）は GeoJSON として
# public/data/ に同梱してあり、DB を経由しない。DB を使うのは投稿だけ。
#
# 注意 1: 背景地図（国土地理院タイル）と徒歩経路（OSRM）は外部サービスを
#         参照するため、起動にはインターネット接続が必要。認証キーは不要。
# 注意 2: ログインは**何も用意しなくてもデモログインで使える**。
#         Google ログインを試したい人だけ app/.env に鍵を置く（.env.example 参照）。

# プロジェクト名を固定する。書かないとディレクトリ名（app）が使われ、
# 同じ名前の別プロジェクトのコンテナと混ざる。
name: ichikawa-opendata-map

services:
  web:
    build: .
    ports:
      # ホスト:コンテナ。**既定は 3000**（readme.txt に書くポート番号と同じ）。
      # 3000 が塞がっている環境だけ、起動するときに変数で逃がす:
      #
      #   CHIZUBA_PORT=3100 docker compose up
      #   （または app/.env に CHIZUBA_PORT=3100 と 1 行書く）
      #
      # ポートを変えても**リダイレクト先はリクエストのホストから毎回導く**ので、
      # 他に直す設定は無い（src/lib/publicOrigin.ts）。
      # コンテナ側の 3000 は Dockerfile の PORT と対。ここは変えない。
      - "${CHIZUBA_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # db へはコンテナ間ネットワークで繋ぐ（ホストには公開していない）。
      # ここに書いた値は下の env_file より優先されるので、.env を置いた人の
      # 環境でも接続先は必ずこのコンテナになる。
      DATABASE_URL: postgres://chizuba:chizuba_local_only@db:5432/chizuba
      # **AUTH_URL はここでは渡さない。** 以前は http://localhost:3000 を
      # 固定で渡していたが、それだと上の公開ポートを変えた瞬間に
      # ログインのリダイレクトが 3000 番へ飛んで壊れた。いまは
      # リクエストのホストから毎回導く（src/lib/publicOrigin.ts）。
      # どうしても固定したい運用だけ app/.env に書く（.env.example）。
    # Google ログイン用の鍵を書くファイル。**無くても起動する**（required: false）。
    # 置かなければ自動でデモログインに切り替わる（app/.env.example を参照）。
    env_file:
      - path: .env
        required: false
    volumes:
      # 投稿写真の実体。DB にはファイル名だけを記録する
      # （.agent/architecture.md「投稿写真の保存」）。
      # 置き場は src/lib/photoStore.ts が「作業ディレクトリ直下の uploads/」に
      # 固定している。WORKDIR が /app なのでここにマウントする。
      - uploads:/app/uploads
    depends_on:
      db:
        # db の healthcheck が通るまで web を起動しない。
        # 配布資料「Docker コンテナの作成例」の例 2 と同じ作法。
        condition: service_healthy

  db:
    # Docker 公式イメージ（DOI）。タグは固定する（latest を使わない）
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chizuba
      POSTGRES_USER: chizuba
      # このパスワードは compose の内部ネットワーク専用。db のポートは
      # ホストに公開していないので、コンテナの外からは接続できない。
      # 審査員が何も設定せずに起動できることを優先して固定値にしてある。
      POSTGRES_PASSWORD: chizuba_local_only
    volumes:
      - db-data:/var/lib/postgresql/data
      # スキーマと初期データ。**ボリュームが空のときだけ**ファイル名順に流れる。
      # 中身を変えたら `docker compose down -v` で作り直すこと。
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -U / -d を付けないと既定の postgres ユーザーで見に行き、
      # 起動途中でも通ってしまうことがある
      test: ["CMD-SHELL", "pg_isready -U chizuba -d chizuba"]
      interval: 3s
      timeout: 3s
      retries: 20
      # 初回起動はスキーマの流し込みがあるぶん時間がかかる
      start_period: 15s
    # db のポートはホストに公開しない。公開すると審査員のマシンで 5432 が
    # 埋まっていたときに起動しなくなる（.agent/architecture.md）。
    # 中を覗きたいときは docker compose exec db psql -U chizuba -d chizuba

volumes:
  # 投稿を消さずにコンテナを作り直せるようにする
  db-data:
  # 投稿写真の実体。db-data と同じく docker compose down -v で消える
  uploads:
